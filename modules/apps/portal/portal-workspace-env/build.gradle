task portalWorkspaceEnvJarsTxtFile

configurations {
	portalWorkspaceEnv
}

dependencies {
	compileInclude group: "org.gradle", name: "gradle-tooling-api", version: "6.6.1"
	compileInclude group: "org.slf4j", name: "slf4j-simple", version: "1.7.10"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "org.apache.felix", name: "org.apache.felix.gogo.runtime", version: "1.1.4"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	compileOnly group: "org.osgi", name: "osgi.core", version: "6.0.0"

	portalWorkspaceEnv group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	portalWorkspaceEnv group: "org.osgi", name: "osgi.annotation", version: "6.0.0"
	portalWorkspaceEnv group: "org.osgi", name: "osgi.core", version: "6.0.0"
	portalWorkspaceEnv project(":apps:portal:portal-aop-api")
	portalWorkspaceEnv project(":sdk:project-templates:project-templates")
	portalWorkspaceEnv project(":util:portal-tools-service-builder")
}

portalWorkspaceEnvJarsTxtFile {
	File file = new File(buildDir, "portal-workspace-env-jars.txt")

	outputs.file(file)

	doFirst {
		file.text = ""

		configurations.portalWorkspaceEnv.resolvedConfiguration.resolvedArtifacts.each {
			file.text += "${it.file.name}\n"
		}
	}
}

processResources {
	from configurations.portalWorkspaceEnv, portalWorkspaceEnvJarsTxtFile
}

repositories {
	maven {
		url "https://repo.gradle.org/gradle/libs-releases"
	}
}