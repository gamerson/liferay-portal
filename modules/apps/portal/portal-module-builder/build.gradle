dependencies {
	compileInclude group: "com.liferay", name: "com.liferay.project.templates", version: "5.0.117"
	compileInclude group: "org.gradle", name: "gradle-tooling-api", version: "6.6.1"
	compileInclude group: "org.slf4j", name: "slf4j-simple", version: "1.7.10"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.3.0"
	compileOnly group: "org.osgi", name: "osgi.core", version: "6.0.0"
}

repositories {
	maven {
		url "https://repo.gradle.org/gradle/libs-releases"
	}
}