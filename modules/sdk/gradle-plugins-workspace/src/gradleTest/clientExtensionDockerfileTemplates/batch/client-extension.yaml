assemble:
    -   from: batch
        into: batch
batch:
    name: Batch
    oAuthApplicationHeadlessServer: batch-oauth-application-headless-server
    type: batch
batch-oauth-application-headless-server:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Batch OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Batch.Engine.everything
    type: oAuthApplicationHeadlessServer