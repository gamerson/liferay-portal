File dockerMockCommand = file("${buildDir}/docker-mock-command")

dockerMockCommand.parentFile.mkdirs()

dockerMockCommand.text = '''#!/bin/sh
while [ $# -gt 0 ]; do
	case "$1" in
		--volume) dir="${2%%:*}"; shift 2 ;;
		-c) [ "$2" = "npm install" ] || exit 1; mkdir -p "$dir/node_modules/express" && touch "$dir/node_modules/express/index.js"; exit $? ;;
		*) shift ;;
	esac
done
exit 1
'''

dockerMockCommand.setExecutable(true)

Task packageClientExtensionTask = tasks.getByPath(":microservice-node:packageClientExtension")

packageClientExtensionTask.containerRuntime.set(dockerMockCommand.absolutePath)

ext.clientExtensionBuildDir = "client-extension-package"
ext.expectedContentStrings = [
	'node_modules/express/index.js',
]
ext.expectedFilePath = "microservice-node-0.1.0-layer.tar"
ext.taskPath = ":microservice-node:packageClientExtension"

apply from: project.property("commonScript.testClientExtensionBuildFileContentsTestCase.gradle")