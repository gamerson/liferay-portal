defaults:
    run:
        shell: bash
jobs:
    test-cloud-helm-chart:
        if: ${{github.repository == 'cloudnative-team/liferay-portal'}}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
            -   name: Install Helm
                uses: azure/setup-helm@v4
            -   name: Set up Kubeconform
                uses: bmuschko/setup-kubeconform@v1
                with:
                    kubeconform-version: 0.7.0
            -   name: Update Helm dependencies
                run: helm dependency update --skip-refresh
                working-directory: ./cloud/helm/${{matrix.chart}}
            -   name: Lint Helm chart
                run: helm lint .
                working-directory: ./cloud/helm/${{matrix.chart}}
            -   name: Render and validate Helm chart
                run: |
                    set -o pipefail

                    helm template liferay . | kubeconform --strict --summary \
                        -schema-location default \
                        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                        -skip ClusterProviderConfig,LiferayInfrastructure
                working-directory: ./cloud/helm/${{matrix.chart}}
        strategy:
            fail-fast: false
            matrix:
                chart:
                    -   aws
                    -   aws-infrastructure
                    -   aws-infrastructure-provider
                    -   aws-marketplace
                    -   default
                    -   gcp
                    -   gcp-infrastructure
                    -   gcp-infrastructure-provider
                    -   gcp-resources
    test-render-cloud-helm-chart:
        if: ${{github.repository == 'cloudnative-team/liferay-portal'}}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
            -   name: Install Helm
                uses: azure/setup-helm@v4
            -   name: Run Helm template golden tests
                run: ./test-render.sh
                working-directory: ./cloud/test/helm
on:
    pull_request:
        paths:
            -   cloud/helm/**
            -   cloud/samples/gitops-repository/**
            -   cloud/test/helm/**
    push:
        branches:
            -   master
        paths:
            -   cloud/**
