defaults:
    run:
        shell: bash
jobs:
    publish:
        env:
            GITHUB_TOKEN: ${{github.token}}
            IS_STAGING: ${{github.repository == 'pt-cloudnative/liferay-portal' && (github.ref_name == 'staging' || github.event_name == 'pull_request')}}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
                    filter: blob:none
                    show-progress: false
            -   id: verify_version
                name: Verify Helm chart version
                run: |
                    set -e

                    CHART_VERSION=$(cat ./Chart.yaml | yq .version)

                    if [[ "${{env.IS_STAGING}}" == "true" ]]
                    then
                        REGISTRY="ghcr.io/${{github.repository_owner}}/charts"
                    else
                        REGISTRY="${{inputs.registry}}"
                    fi

                    echo "Verifying Helm chart version ${CHART_VERSION} in ${REGISTRY}."

                    # We try to verify version, but ignore failure if it's a dry run and we might not have registry access
                    if ! helm show readme "oci://${REGISTRY}/${{inputs.chart_name}}:${CHART_VERSION}" >/dev/null 2>&1
                    then
                        echo "Verified Helm Chart version ${CHART_VERSION}."

                        echo "CHART_VERSION=${CHART_VERSION}" >> ${GITHUB_ENV}

                        echo "registry=${REGISTRY}" >> ${GITHUB_OUTPUT}

                        echo "should_publish=true" >> ${GITHUB_OUTPUT}
                    else
                        if [[ "${{inputs.dry_run}}" == "true" ]]
                        then
                             echo "Chart version ${CHART_VERSION} already exists, but continuing dry-run verification."
                             echo "CHART_VERSION=${CHART_VERSION}" >> ${GITHUB_ENV}
                             echo "registry=${REGISTRY}" >> ${GITHUB_OUTPUT}
                             echo "should_publish=true" >> ${GITHUB_OUTPUT}
                        else
                             echo "Chart version ${CHART_VERSION} already exists. Skipping publish."
                        fi
                    fi
                working-directory: ${{inputs.working_directory}}
            -   id: auth
                if: ${{steps.verify_version.outputs.should_publish == 'true' && env.IS_STAGING == 'false' && inputs.dry_run == false}}
                name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v2
                with:
                    service_account: ${{secrets.GCP_SA}}
                    token_format: access_token
                    workload_identity_provider: ${{secrets.GCP_WORKLOAD_IDENTITY_PROVIDER}}
            -   if: ${{steps.verify_version.outputs.should_publish == 'true' && env.IS_STAGING == 'false' && inputs.dry_run == false}}
                name: Log in to GAR
                run: |
                    echo "${{steps.auth.outputs.access_token}}" \
                        | helm registry login "${{inputs.registry}}" \
                            --password-stdin \
                            --username oauth2accesstoken
            -   if: ${{steps.verify_version.outputs.should_publish == 'true' && env.IS_STAGING == 'true' && inputs.dry_run == false}}
                name: Log in to GHCR
                run: |
                    echo "${{github.token}}" \
                        | helm registry login ghcr.io \
                            --password-stdin \
                            --username "${{github.actor}}"
            -   if: ${{steps.verify_version.outputs.should_publish == 'true'}}
                name: Package Helm chart
                run: |
                    set -e

                    DIST_DIR="${{runner.temp}}/${{inputs.chart_name}}/dist"

                    rm -fr "${DIST_DIR}"

                    mkdir --parents "${DIST_DIR}"

                    helm dependency update

                    helm package . \
                        --destination "${DIST_DIR}" \
                        --version "${CHART_VERSION}"
                working-directory: ${{inputs.working_directory}}
            -   if: ${{steps.verify_version.outputs.should_publish == 'true' && inputs.dry_run == false}}
                name: Push Helm chart
                run: |
                    set -e

                    DIST_DIR="${{runner.temp}}/${{inputs.chart_name}}/dist"

                    for file_name in "${DIST_DIR}"/*.tgz
                    do
                        echo "Pushing ${file_name} to oci://${{steps.verify_version.outputs.registry}}."

                        helm push "${file_name}" "oci://${{steps.verify_version.outputs.registry}}"
                    done
                working-directory: ${{inputs.working_directory}}
            -   if: ${{steps.verify_version.outputs.should_publish == 'true' && env.IS_STAGING == 'true' && inputs.dry_run == false}}
                name: Configure Git
                run: |
                    git config user.name "${{github.actor}}"
                    git config user.email "${{github.actor}}@users.noreply.github.com"
            -   if: ${{steps.verify_version.outputs.should_publish == 'true' && env.IS_STAGING == 'true' && inputs.dry_run == false}}
                name: Run chart-releaser
                uses: helm/chart-releaser-action@v1.7.0
                env:
                    CR_TOKEN: "${{github.token}}"
                with:
                    charts_dir: cloud/helm
                    skip_existing: true
on:
    workflow_call:
        inputs:
            chart_name:
                required: true
                type: string
            dry_run:
                default: false
                required: false
                type: boolean
            registry:
                required: true
                type: string
            working_directory:
                required: true
                type: string