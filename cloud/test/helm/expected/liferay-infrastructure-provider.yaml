# Source: liferay-gcp-infrastructure-provider/charts/liferay-subchart-backup-create/templates/clusterworkflowtemplate.yaml
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
    labels:
        component: backup-create-platform
    name: backup-create-cluster-workflow-template
spec:
    entrypoint: main
    podGC:
        strategy: OnWorkflowSuccess
    serviceAccountName: backup-create-service-account
    templates:
        -   inputs:
                parameters:
                    -   name: environment-id
                    -   name: project-id
            name: create-backup
            outputs:
                parameters:
                    -   name: backup-name
                        valueFrom:
                            jsonPath: "{.metadata.name}"
            resource:
                action: create
                manifest: |-
                    apiVersion: backup.liferay.cloud/v1alpha1
                    kind: LiferayBackup
                    metadata:
                        generateName: "liferay-backup-"
                        namespace: {{workflow.namespace}}
                    spec:
                        databaseSnapshot:
                            databaseInstanceLookup:
                                matchLabels:
                                    active: "true"
                                    app: liferay
                                    environment-id: {{inputs.parameters.environment-id}}
                                    project-id: {{inputs.parameters.project-id}}
                                    should-back-up: "true"
                        documentLibrary:
                            destination:
                                gcs:
                                    bucketLookup:
                                        matchLabels:
                                            app: liferay
                                            environment-id: {{inputs.parameters.environment-id}}
                                            is-backup-vault: "true"
                                            project-id: {{inputs.parameters.project-id}}
                                type: gcs
                            source:
                                gcs:
                                    bucketLookup:
                                        matchLabels:
                                            active: "true"
                                            app: liferay
                                            environment-id: {{inputs.parameters.environment-id}}
                                            project-id: {{inputs.parameters.project-id}}
                                            should-back-up: "true"
                                type: gcs
        -   name: get-project-id-and-environment-id
            outputs:
                parameters:
                    -   name: environment-id
                        valueFrom:
                            path: /tmp/environment-id.txt
                    -   name: project-id
                        valueFrom:
                            path: /tmp/project-id.txt
            script:
                command: [sh]
                image: "dtzar/helm-kubectl:4.1.1"
                resources:
                    limits:
                      cpu: 250m
                      memory: 256Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                source: |-
                    #!/bin/sh
                    
                    set -o errexit
                    set -o nounset
                    
                    function main {
                    	local liferay_infrastructure_json
                    
                    	liferay_infrastructure_json=$( \
                    		kubectl \
                    			get \
                    			liferayinfrastructure \
                    			--output json \
                    			| jq ".items[0]")
                    
                    	echo "${liferay_infrastructure_json}" | jq --raw-output ".spec.environmentId" > /tmp/environment-id.txt
                    	echo "${liferay_infrastructure_json}" | jq --raw-output ".spec.projectId" > /tmp/project-id.txt
                    }
                    
                    main
        -   name: main
            steps:
                -   -   name: get-project-id-and-environment-id
                        template: get-project-id-and-environment-id
                -   -   arguments:
                            parameters:
                                -   name: environment-id
                                    value: "{{steps.get-project-id-and-environment-id.outputs.parameters.environment-id}}"
                                -   name: project-id
                                    value: "{{steps.get-project-id-and-environment-id.outputs.parameters.project-id}}"
                        name: create-backup
                        template: create-backup
                -   -   arguments:
                            parameters:
                                -   name: backup-name
                                    value: "{{steps.create-backup.outputs.parameters.backup-name}}"
                        name: wait-for-backup
                        template: wait-for-backup
        -   inputs:
                parameters:
                    -   name: backup-name
            name: wait-for-backup
            script:
                command: [sh]
                image: "dtzar/helm-kubectl:4.1.1"
                resources:
                    limits:
                      cpu: 250m
                      memory: 256Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                source: |-
                    #!/bin/sh
                    
                    set -o errexit
                    set -o nounset
                    
                    function main {
                    	local backup_name="{{inputs.parameters.backup-name}}"
                    
                    	local timeout
                    
                    	timeout=$(($(date +%s) + 7200))
                    
                    	while [ $(date +%s) -lt ${timeout} ]
                    	do
                    		local succeeded_condition
                    
                    		succeeded_condition=$( \
                    			kubectl \
                    				get \
                    				liferaybackup \
                    				"${backup_name}" \
                    				--output jsonpath="{.status.conditions[?(@.type==\"Succeeded\")]}" 2>/dev/null || echo "{}")
                    
                    		local status
                    
                    		status=$(echo "${succeeded_condition}" | jq --raw-output ".status")
                    
                    		if [ "${status}" = "True" ]
                    		then
                    			exit 0
                    		fi
                    
                    		if [ "${status}" = "False" ]
                    		then
                    			echo "LiferayBackup ${backup_name} failed: $(echo "${succeeded_condition}" | jq --raw-output ".reason")" >&2
                    
                    			exit 1
                    		fi
                    
                    		sleep 30
                    	done
                    
                    	echo "The system timed out waiting for LiferayBackup ${backup_name} to succeed." >&2
                    
                    	exit 1
                    }
                    
                    main
    ttlStrategy:
        secondsAfterCompletion: 86400
