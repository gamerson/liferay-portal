apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        app: liferay
        component: gateway
    name: liferay-gateway-class
spec:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    parametersRef:
