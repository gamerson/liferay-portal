                                        {{- $backupTargetLabels | toYaml | nindent 16 }}
                                        active: {{ printf "%t" (eq $dataPlane $activeDataPlane) | quote }}
                            managementPolicies: {{ $databaseInstanceManagementPolicies }}
                        ---
                        apiVersion: sql.gcp.m.upbound.io/v1beta1
                        kind: Database
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $databaseName }}
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-db-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                            name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
                        spec:
                            forProvider:
                                charset: UTF8
                                collation: en_US.UTF8
                                instanceSelector:
                                    matchLabels:
                                        dataPlane: {{ $dataPlane }}
                            managementPolicies: ["Create", "Observe", "Update"]
                        ---
                        apiVersion: sql.gcp.m.upbound.io/v1beta1
                        kind: User
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $databaseIamUser }}
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-iam-user-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                            name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
                        spec:
                            forProvider:
                                instanceSelector:
                                    matchLabels:
                                        dataPlane: {{ $dataPlane }}
                                type: CLOUD_IAM_SERVICE_ACCOUNT
                            managementPolicies: ["Create", "Observe", "Update"]
                        {{- end }}
                        {{- range $dataPlane := list "blue" "green" }}
                        {{- $databaseInstanceName := printf "%s-db-instance-%s" $xr.metadata.name $dataPlane }}
                        {{- $databaseResourceName := printf "liferay-db-%s" $dataPlane }}
                        {{- $userResourceName := printf "liferay-iam-user-%s" $dataPlane }}
                        {{- if or (has $dataPlane $dataPlanes) (and $.observed.resources (index $.observed.resources $databaseResourceName)) }}
                        ---
                        apiVersion: protection.crossplane.io/v1beta1
                        kind: Usage
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-database-{{ $dataPlane }}
                            name: {{ $xr.metadata.name }}-instance-by-database-{{ $dataPlane }}
                            namespace: {{ $namespace }}
                        spec:
                            by:
                                apiVersion: sql.gcp.m.upbound.io/v1beta1
                                kind: Database
                                resourceRef:
                                    name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
                            of:
                                apiVersion: sql.gcp.m.upbound.io/v1beta1
                                kind: DatabaseInstance
                                resourceRef:
                                    name: {{ $databaseInstanceName }}
                        {{- end }}
                        {{- if or (has $dataPlane $dataPlanes) (and $.observed.resources (index $.observed.resources $userResourceName)) }}
                        ---
                        apiVersion: protection.crossplane.io/v1beta1
                        kind: Usage
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-user-{{ $dataPlane }}
                            name: {{ $xr.metadata.name }}-instance-by-user-{{ $dataPlane }}
                            namespace: {{ $namespace }}
                        spec:
                            by:
                                apiVersion: sql.gcp.m.upbound.io/v1beta1
                                kind: User
                                resourceRef:
                                    name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
                            of:
                                apiVersion: sql.gcp.m.upbound.io/v1beta1
                                kind: DatabaseInstance
                                resourceRef:
                                    name: {{ $databaseInstanceName }}
                        {{- end }}
                        {{- end }}
                        ---
                        
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-ksa
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: {{ $xr.metadata.name }}-ksa
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    kind: ServiceAccount
                                    metadata:
                                        annotations:
                                            iam.gke.io/gcp-service-account: {{ $gsaEmail }}
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: liferay-default
                                        namespace: {{ $namespace }}
                        {{- range $dataPlane := $dataPlanes }}
                        {{- $dbInstanceResourceName := printf "database-primary-%s" $dataPlane }}
                        {{- $dbReady := false }}
                        {{- if $.observed.resources }}
                            {{- if (index $.observed.resources $dbInstanceResourceName) }}
                                {{- $db := index $.observed.resources $dbInstanceResourceName }}
                                {{- range $cond := $db.resource.status.conditions | default list }}
                                    {{- if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                                        {{- $dbReady = true }}
                                    {{- end }}
                                {{- end }}
                            {{- end }}
                        {{- end }}
                        {{- if $dbReady }}
                        {{- $instanceConnectionName := printf "%s:%s:%s-db-instance-%s" $env.projectId $region $xr.metadata.name $dataPlane }}
                        {{- $jobName := printf "%s-db-grant-%s" $xr.metadata.name $dataPlane }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-db-grant-job-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                            name: {{ $jobName }}
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: batch/v1
                                    kind: Job
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                            dataPlane: {{ $dataPlane }}
                                        name: {{ $jobName }}
                                        namespace: {{ $namespace }}
                                    spec:
                                        template:
                                            spec:
                                                containers:
                                                    -   args:
                                                            -   |
                                                                    set -e
                                                                    until pg_isready -h 127.0.0.1 -p {{ $databasePort }} -U postgres; do sleep 2; done
                                                                    psql -h 127.0.0.1 -v "ON_ERROR_STOP=1" -U postgres -d {{ $databaseName }} <<EOF
                                                                    GRANT ALL PRIVILEGES ON DATABASE "{{ $databaseName }}" TO "{{ $databaseIamUser }}";
                                                                    GRANT ALL ON ALL TABLES IN SCHEMA public TO "{{ $databaseIamUser }}";
                                                                    GRANT cloudsqlsuperuser TO "{{ $databaseIamUser }}";
                                                                    GRANT "{{ $databaseIamUser }}" to postgres;
                                                                    EOF
                                                        command:
                                                            -   /bin/sh
                                                            -   -c
                                                        env:
                                                            -   name: PGPASSWORD
                                                                valueFrom:
                                                                    secretKeyRef:
                                                                        key: password
                                                                        name: {{ $databaseSpec.rootPasswordSecretName }}
                                                        image: postgres:18-alpine
                                                        name: sql-runner
                                                        resources:
                                                            limits:
                                                                cpu: 200m
                                                                memory: 256Mi
                                                            requests:
                                                                cpu: 100m
                                                                memory: 128Mi
                                                        securityContext:
                                                            allowPrivilegeEscalation: false
                                                            capabilities:
                                                                drop:
                                                                    -   ALL
                                                            runAsNonRoot: true
                                                            runAsUser: 1000
                                                            seccompProfile:
                                                                type: RuntimeDefault
                                                initContainers:
                                                    -   args:
                                                            -   --auto-iam-authn
                                                            -   --port={{ $databasePort }}
                                                            -   --private-ip
                                                            -   --structured-logs
                                                            -   "{{ $instanceConnectionName }}"
                                                        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
                                                        name: cloud-sql-proxy
                                                        resources:
                                                            limits:
                                                                cpu: 200m
                                                                memory: 256Mi
                                                            requests:
                                                                cpu: 100m
                                                                memory: 128Mi
                                                        restartPolicy: Always
                                                        securityContext:
                                                            allowPrivilegeEscalation: false
                                                            capabilities:
                                                                drop:
                                                                    -   ALL
                                                            runAsNonRoot: true
                                                            runAsUser: 65532
                                                            seccompProfile:
                                                                type: RuntimeDefault
                                                restartPolicy: OnFailure
                                                securityContext:
                                                    fsGroup: 1000
                                                    runAsNonRoot: true
                                                    seccompProfile:
                                                        type: RuntimeDefault
                                                serviceAccountName: liferay-default
                                                volumes:
                                                    -   emptyDir: {}
                                                        name: term-log
                            managementPolicies: {{ $managementPoliciesOnce }}
                            readiness:
                                celQuery: object.status.succeeded == 1
                                policy: DeriveFromCelQuery
                        {{- end }}
                        {{- end }}
                        ---
                        {{- $isReady = false }}
                        {{- if .observed.resources }}
                            {{- $activeJobResourceName := printf "liferay-db-grant-job-%s" $activeDataPlane }}
                            {{- if (index .observed.resources $activeJobResourceName) }}
                                {{- $job := index .observed.resources $activeJobResourceName }}
                                {{- range $cond := $job.resource.status.conditions | default list }}
                                    {{- if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                                        {{- $isReady = true }}
                                    {{- end }}
                                {{- end }}
                            {{- end }}
                        {{- end }}
                        {{- if $isReady }}
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $baseName }}-managed-service-details-secret
                                gotemplating.fn.crossplane.io/composition-resource-name: managed-service-details-secret
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: {{ $baseName }}-managed-service-details-secret
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    data:
                                        DATABASE_ENDPOINT: {{ "localhost" | b64enc | quote }}
                                        DATABASE_INSTANCE_NAME: {{ printf "%s:%s:%s-db-instance-%s" $env.projectId $region $xr.metadata.name $activeDataPlane | b64enc | quote }}
                                        DATABASE_PORT: {{ $databasePort | default 5432 | toString | b64enc | quote }}
                                        DATABASE_USERNAME: {{ $databaseIamUser | toString | b64enc | quote }}
                                        LIFERAY_GCS_BUCKET_NAME: {{ printf "%s-dl-%s" $baseName $activeDataPlane | b64enc | quote }}
                                        LIFERAY_OVERLAY_BUCKET_NAME: {{ $overlay.bucketName | default "" | b64enc | quote }}
                                    kind: Secret
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: managed-service-details
                                        namespace: {{ $namespace }}
                                    type: Opaque
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        ---
                        apiVersion: gcp.liferay.com/v1alpha1
                        kind: LiferayInfrastructure
                        status:
                            managedServiceDetailsReady: {{ $isReady }}
                        ---
                        
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: elasticsearch-observer
                            name: {{ $searchName }}-observer
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: elasticsearch.k8s.elastic.co/v1
                                    kind: Elasticsearch
                                    metadata:
                                        name: {{ $searchName }}
                                        namespace: {{ $searchNamespace }}
                            managementPolicies: ["Observe"]
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: elasticsearch-secret-observer
                            name: {{ $searchSecretName }}-observer
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    kind: Secret
                                    metadata:
                                        name: {{ $searchSecretName }}
                                        namespace: {{ $searchNamespace }}
                            managementPolicies: ["Observe"]
                        ---
                        {{- if .observed.resources }}
                        {{- $elasticsearchObject := (index .observed.resources "elasticsearch-observer" | default dict).resource | default dict -}}
                        {{- $elasticsearchObjectAtProvider := ($elasticsearchObject.status | default dict).atProvider | default dict -}}
                        {{- $elasticsearchObjectAtProviderManifest := (index $elasticsearchObjectAtProvider "manifest" | default dict) -}}
                        {{- $elasticsearchObjectAtProviderManifestStatus := (index $elasticsearchObjectAtProviderManifest "status" | default dict) -}}
                        
                        {{- $elasticsearchHealth = (index $elasticsearchObjectAtProviderManifestStatus "health" | default "") -}}
                        {{- $isSearchReady = or (eq $elasticsearchHealth "green") (eq $elasticsearchHealth "yellow") -}}
                        
                        {{- $secretObject := (index .observed.resources "elasticsearch-secret-observer" | default dict).resource | default dict -}}
                        {{- $secretObjectAtProvider := ($secretObject.status | default dict).atProvider | default dict -}}
                        {{- $secretObjectAtProviderManifest := (index $secretObjectAtProvider "manifest" | default dict) -}}
                        {{- $secretObjectAtProviderManifestData := (index $secretObjectAtProviderManifest "data" | default dict) -}}
                        {{- $secretObjectAtProviderManifestDataPassword := (index $secretObjectAtProviderManifestData "elastic" | default "") -}}
                        
                        {{- if and $isSearchReady $secretObjectAtProviderManifestDataPassword }}
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                crossplane.io/external-name: elasticsearch-connection-details
                                gotemplating.fn.crossplane.io/composition-resource-name: elasticsearch-connection-details-secret
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: {{ $xr.metadata.name }}-elasticsearch-connection-details-secret
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    data:
                                        ELASTICSEARCH_PASSWORD: {{ $secretObjectAtProviderManifestDataPassword }}
                                    kind: Secret
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: elasticsearch-connection-details
                                        namespace: {{ $namespace }}
                                    stringData:
                                        ELASTICSEARCH_URL: http://{{ $searchName }}-es-http.{{ $searchNamespace }}.svc:9200
                                        ELASTICSEARCH_USERNAME: elastic
                                    type: Opaque
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        {{- end }}
                        ---
                        
                        {{- range $i, $dataPlane := list "blue" "green" }}
                        {{- if $i }}
                        ---
                        {{- end }}
                        apiVersion: storage.gcp.m.upbound.io/v1beta1
                        kind: Bucket
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-gcs-bucket-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                            name: {{ $baseName }}-dl-{{ $dataPlane }}
                        spec:
                            forProvider:
                                {{- if $cmkEnabled }}
                                encryption:
                                    defaultKmsKeyName: {{ $cmkKeyName }}
                                {{- end }}
                                forceDestroy: {{ $forceDestroy }}
                                labels:
                                    {{- $backupTargetLabels | toYaml | nindent 12 }}
                                    active: {{ printf "%t" (eq $dataPlane $activeDataPlane) | quote }}
                                location: {{ $storage.region | default $region }}
                                storageClass: STANDARD
                                uniformBucketLevelAccess: true
                                versioning:
                                    enabled: {{ $storage.enableVersioning | default true }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: storage.gcp.m.upbound.io/v1beta1
                        kind: BucketIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-gcs-iam-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                        spec:
                            forProvider:
                                bucketSelector:
                                    matchLabels:
                                        dataPlane: {{ $dataPlane }}
                                member: serviceAccount:{{ $gsaEmail }}
                                role: roles/storage.admin
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        ---
                        
                        {{- if and $overlay.enabled $overlay.bucketName }}
                        apiVersion: storage.gcp.m.upbound.io/v1beta1
                        kind: BucketIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-gsa-overlay-bucket-iam
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                        spec:
                            forProvider:
                                bucket: {{ $overlay.bucketName }}
                                member: serviceAccount:{{ $gsaEmail }}
                                role: roles/storage.objectViewer
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        
                        ---
                        
                        {{- if $cmkEnabled }}
                        apiVersion: kms.gcp.m.upbound.io/v1beta1
                        kind: KeyRing
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-keyring
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: {{ $baseName }}-keyring
                        spec:
                            forProvider:
                                location: {{ $region }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kms.gcp.m.upbound.io/v1beta1
                        kind: CryptoKey
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-cryptokey
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: {{ $baseName }}-key
                        spec:
                            forProvider:
                                keyRingSelector:
                                    matchControllerRef: true
                                purpose: ENCRYPT_DECRYPT
                                rotationPeriod: 86400s
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kms.gcp.m.upbound.io/v1beta1
                        kind: CryptoKeyIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-sql-kms-binding
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                        spec:
                            forProvider:
                                cryptoKeyIdRef:
                                    name: {{ $baseName }}-key
                                member: serviceAccount:service-{{ $env.projectNumber }}@gcp-sa-cloud-sql.iam.gserviceaccount.com
                                role: roles/cloudkms.cryptoKeyEncrypterDecrypter
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kms.gcp.m.upbound.io/v1beta1
                        kind: CryptoKeyIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: liferay-storage-kms-binding
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                        spec:
                            forProvider:
                                cryptoKeyIdRef:
                                    name: {{ $baseName }}-key
                                member: serviceAccount:service-{{ $env.projectNumber }}@gs-project-accounts.iam.gserviceaccount.com
                                role: roles/cloudkms.cryptoKeyEncrypterDecrypter
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        ---
                        
                        {{- if $backup.enabled }}
                        {{- $backupRestorePrincipal := printf "principal://iam.googleapis.com/projects/%s/locations/global/workloadIdentityPools/%s.svc.id.goog/subject/ns/%s/sa/backup-restore-service-account" $env.projectNumber $env.projectId $namespace }}
                        {{- $backupVaultLabels := merge (dict) $labels (dict "is-backup-vault" "true") }}
                        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
                        kind: ProjectIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-cloudsql-admin
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                        spec:
                            forProvider:
                                member: {{ $backupRestorePrincipal | quote }}
                                project: {{ $env.projectId }}
                                role: roles/cloudsql.admin
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
                        kind: ProjectIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-sts-admin
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                        spec:
                            forProvider:
                                member: {{ $backupRestorePrincipal | quote }}
                                project: {{ $env.projectId }}
                                role: roles/storagetransfer.admin
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-create-role-binding
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: backup-create-role-binding
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: rbac.authorization.k8s.io/v1
                                    kind: RoleBinding
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: backup-create-role-binding
                                        namespace: {{ $namespace }}
                                    roleRef:
                                        apiGroup: rbac.authorization.k8s.io
                                        kind: ClusterRole
                                        name: backup-create-cluster-role
                                    subjects:
                                        -   kind: ServiceAccount
                                            name: backup-create-service-account
                                            namespace: {{ $namespace }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-create-service-account
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: backup-create-service-account
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    kind: ServiceAccount
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: backup-create-service-account
                                        namespace: {{ $namespace }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-backup-reader-cluster-role-binding
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: backup-restore-backup-reader-cluster-role-binding-{{ $baseName }}
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: rbac.authorization.k8s.io/v1
                                    kind: ClusterRoleBinding
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: backup-restore-backup-reader-cluster-role-binding-{{ $baseName }}
                                    roleRef:
                                        apiGroup: rbac.authorization.k8s.io
                                        kind: ClusterRole
                                        name: backup-restore-backup-reader-cluster-role
                                    subjects:
                                        -   kind: ServiceAccount
                                            name: backup-restore-service-account
                                            namespace: {{ $namespace }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-role-binding
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: backup-restore-role-binding
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: rbac.authorization.k8s.io/v1
                                    kind: RoleBinding
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: backup-restore-role-binding
                                        namespace: {{ $namespace }}
                                    roleRef:
                                        apiGroup: rbac.authorization.k8s.io
                                        kind: ClusterRole
                                        name: backup-restore-env-cluster-role
                                    subjects:
                                        -   kind: ServiceAccount
                                            name: backup-restore-service-account
                                            namespace: {{ $namespace }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-service-account
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                            name: backup-restore-service-account
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    kind: ServiceAccount
                                    metadata:
                                        labels:
                                            {{- $labels | toYaml | nindent 20 }}
                                        name: backup-restore-service-account
                                        namespace: {{ $namespace }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: storage.gcp.m.upbound.io/v1beta1
                        kind: Bucket
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: {{ $baseName }}-vault
                            labels:
                                {{- $backupVaultLabels | toYaml | nindent 8 }}
                            name: {{ $baseName }}-vault
                        spec:
                            forProvider:
                                {{- if $cmkEnabled }}
                                encryption:
                                    defaultKmsKeyName: {{ $cmkKeyName | quote }}
                                {{- end }}
                                forceDestroy: {{ $forceDestroy }}
                                labels:
                                    {{- $backupVaultLabels | toYaml | nindent 12 }}
                                lifecycleRule:
                                    -   action:
                                            type: Delete
                                        condition:
                                            age: {{ add $backup.retentionDays 2 }}
                                location: {{ $backup.region | default $region }}
                                storageClass: {{ $backup.storageClass | quote }}
                                uniformBucketLevelAccess: true
                            managementPolicies: {{ $managementPolicies }}
                        {{- range $dataPlane := list "blue" "green" }}
                        ---
                        apiVersion: storage.gcp.m.upbound.io/v1beta1
                        kind: BucketIAMMember
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: backup-restore-dl-writer-{{ $dataPlane }}
                            labels:
                                {{- $labels | toYaml | nindent 8 }}
                                dataPlane: {{ $dataPlane }}
                        spec:
                            forProvider:
                                bucketSelector:
                                    matchLabels:
                                        dataPlane: {{ $dataPlane }}
                                member: {{ $backupRestorePrincipal | quote }}
                                role: roles/storage.objectUser
                            managementPolicies: {{ $managementPolicies }}
                        {{- end }}
                        {{- end }}
                        ---
                        
                        apiVersion: kubernetes.m.crossplane.io/v1alpha1
                        kind: Object
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: composition-context
                            name: {{ $xr.metadata.name }}-composition-context
                        spec:
                            forProvider:
                                manifest:
                                    apiVersion: v1
                                    kind: ConfigMap
                                    metadata:
                                        name: composition-context
                                        namespace: {{ $namespace }}
                                    data:
                                        variables: |
                                            backup: {{ $backup | toJson }}
                                            backupTargetLabels: {{ $backupTargetLabels | toJson }}
                                            baseName: {{ $baseName | toJson }}
                                            cmkEnabled: {{ $cmkEnabled | toJson }}
                                            cmkKeyName: {{ $cmkKeyName | toJson }}
                                            databaseIamUser: {{ $databaseIamUser | toJson }}
                                            databaseName: {{ $databaseName | toJson }}
                                            databasePort: {{ $databasePort | toJson }}
                                            databaseSpec: {{ $databaseSpec | toJson }}
                                            elasticsearchHealth: {{ $elasticsearchHealth | toJson }}
                                            environmentId: {{ $environmentId | toJson }}
                                            forceDestroy: {{ $forceDestroy | toJson }}
                                            gsaEmail: {{ $gsaEmail | toJson }}
                                            gsaName: {{ $gsaName | toJson }}
                                            hash: {{ $hash | toJson }}
                                            isReady: {{ $isReady | toJson }}
                                            isSearchReady: {{ $isSearchReady | toJson }}
                                            labels: {{ $labels | toJson }}
                                            managementPolicies: {{ $managementPolicies | toJson }}
                                            managementPoliciesOnce: {{ $managementPoliciesOnce | toJson }}
                                            namespace: {{ $namespace | toJson }}
                                            overlay: {{ $overlay | toJson }}
                                            projectId: {{ $projectId | toJson }}
                                            projectIdFull: {{ $projectIdFull | toJson }}
                                            region: {{ $region | toJson }}
                                            searchName: {{ $searchName | toJson }}
                                            searchNamespace: {{ $searchNamespace | toJson }}
                                            searchSecretName: {{ $searchSecretName | toJson }}
                                            storage: {{ $storage | toJson }}
                                            uidHash: {{ $uidHash | toJson }}
                            managementPolicies: {{ $managementPolicies }}
                        
                kind: Input
                source: Inline
            step: go-templating
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources
