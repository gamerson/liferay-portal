                replicas: 3
            envoyHpa:
                maxReplicas: 10
                metrics:
                    -   resource:
                            name: cpu
                            target:
                                averageUtilization: 75
                                type: Utilization
                        type: Resource
                minReplicas: 3
            envoyService:
                annotations:
                externalTrafficPolicy: Local
                type: LoadBalancer
        type: Kubernetes
---
