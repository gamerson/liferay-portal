                        namespace: {{workflow.namespace}}
                    spec:
                        restorePhase: {{inputs.parameters.restore-phase}}
                        targetActiveDataPlane: {{inputs.parameters.target-active-data-plane}}
                mergeStrategy: merge
        -   inputs:
                parameters:
                    -   name: liferay-infrastructure-name
                    -   name: restore-phase
                    -   name: target-active-data-plane
            name: apply-wait-infrastructure
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{inputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: "{{inputs.parameters.restore-phase}}"
                                -   name: target-active-data-plane
                                    value: "{{inputs.parameters.target-active-data-plane}}"
                        name: apply-infrastructure
                        template: apply-infrastructure
                -   -   arguments:
                            parameters:
                                -   name: expected-generation
                                    value: "{{steps.apply-infrastructure.outputs.parameters.generation}}"
                        name: wait-for-infrastructure
                        template: wait-for-infrastructure
        -   container:
                args:
                    -   storage
                    -   rm
                    -   --recursive
                    -   "gs://{{inputs.parameters.dl-bucket-id}}/**"
                command: [gcloud]
                env:
                    -   name: CLOUDSDK_CONFIG
                        value: /tmp/gcloud
                image: "google/cloud-sdk:565.0.0-stable"
                resources:
                    limits:
                      cpu: 250m
                      memory: 256Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
            inputs:
                parameters:
                    -   name: dl-bucket-id
            name: clean-up-dl-bucket
        -   inputs:
                parameters:
                    -   name: dl-bucket-id
                    -   name: liferay-infrastructure-name
                    -   name: target-active-data-plane
            name: clean-up-infrastructure
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{inputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: none
                                -   name: target-active-data-plane
                                    value: "{{inputs.parameters.target-active-data-plane}}"
                        name: clean-up-cloudsql-instance
                        template: apply-wait-infrastructure
                    -   arguments:
                            parameters:
                                -   name: dl-bucket-id
                                    value: "{{inputs.parameters.dl-bucket-id}}"
                        name: clean-up-dl-bucket
                        template: clean-up-dl-bucket
        -   inputs:
                parameters:
                    -   name: liferay-backup-namespace
            name: get-current-infrastructure-state
            outputs:
                parameters:
                    -   name: data-active
                        valueFrom:
                            path: /tmp/data-plane-active.txt
                    -   name: data-inactive
                        valueFrom:
                            path: /tmp/data-plane-inactive.txt
                    -   name: database-snapshot-uuid
                        valueFrom:
                            path: /tmp/database-snapshot-uuid.txt
                    -   name: dl-bucket-active
                        valueFrom:
                            path: /tmp/dl-bucket-active.txt
                    -   name: dl-bucket-inactive
                        valueFrom:
                            path: /tmp/dl-bucket-inactive.txt
                    -   name: liferay-infrastructure-name
                        valueFrom:
                            path: /tmp/liferay-infrastructure-name.txt
                    -   name: liferay-workload-name
                        valueFrom:
                            path: /tmp/liferay-workload-name.txt
                    -   name: vault-bucket
                        valueFrom:
                            path: /tmp/vault-bucket.txt
                    -   name: vault-path
                        valueFrom:
                            path: /tmp/vault-path.txt
            script:
                command: [sh]
                image: "dtzar/helm-kubectl:4.1.1"
                resources:
                    limits:
                      cpu: 250m
                      memory: 256Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                source: |-
                    #!/bin/sh
                    
                    set -o errexit
                    set -o nounset
                    
                    function main {
                    	local liferay_backup_name="{{workflow.parameters.liferay-backup-name}}"
                    	local liferay_backup_namespace="{{inputs.parameters.liferay-backup-namespace}}"
                    
                    	local liferay_backup_json
                    
                    	liferay_backup_json=$( \
                    		kubectl \
                    			get \
                    			liferaybackups.backup.liferay.cloud \
                    			"${liferay_backup_name}" \
                    			--namespace "${liferay_backup_namespace}" \
                    			--output json)
                    
                    	local database_snapshot_uuid
                    
                    	database_snapshot_uuid=$(echo "${liferay_backup_json}" | jq --raw-output ".status.databaseSnapshot.uuid // \"\"")
                    
                    	if [ -z "${database_snapshot_uuid}" ]
                    	then
                    		echo "The LiferayBackup \"${liferay_backup_name}\" has no status.databaseSnapshot.uuid." >&2
                    
                    		exit 1
                    	fi
                    
                    	echo "${database_snapshot_uuid}" > /tmp/database-snapshot-uuid.txt
                    
                    	local vault_bucket
                    
                    	vault_bucket=$(echo "${liferay_backup_json}" | jq --raw-output ".status.documentLibrary.destinationBucket // \"\"")
                    
                    	if [ -z "${vault_bucket}" ]
                    	then
                    		echo "The LiferayBackup \"${liferay_backup_name}\" has no status.documentLibrary.destinationBucket." >&2
                    
                    		exit 1
                    	fi
                    
                    	echo "${vault_bucket}" > /tmp/vault-bucket.txt
                    
                    	local vault_path
                    
                    	vault_path=$(echo "${liferay_backup_json}" | jq --raw-output ".status.documentLibrary.destinationPath // \"\"")
                    
                    	echo "${vault_path}" > /tmp/vault-path.txt
                    
                    	local liferay_infrastructure_json
                    
                    	liferay_infrastructure_json=$( \
                    		kubectl \
                    			get \
                    			liferayinfrastructure \
                    			--output json \
                    			| jq ".items[0]")
                    
                    	local restore_phase
                    
                    	restore_phase=$(echo "${liferay_infrastructure_json}" | jq --raw-output ".spec.restorePhase // \"none\"")
                    
                    	if [ "${restore_phase}" = "promoting" ] || [ "${restore_phase}" = "provisioning" ]
                    	then
                    		echo "The LiferayInfrastructure spec.restorePhase is set to ${restore_phase}. A restore is in progress." >&2
                    
                    		exit 1
                    	fi
                    
                    	local data_plane_active
                    
                    	data_plane_active=$(echo "${liferay_infrastructure_json}" | jq --raw-output ".spec.targetActiveDataPlane // \"blue\"")
                    
                    	echo "${data_plane_active}" > /tmp/data-plane-active.txt
                    
