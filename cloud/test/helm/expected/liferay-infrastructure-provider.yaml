# Source: liferay-gcp-infrastructure-provider/templates/environment-config.yaml
apiVersion: apiextensions.crossplane.io/v1beta1
data:
    deploymentName: "sample"
    projectId: "sample-project"
    projectNumber: "123456789012"
    vpcName: "sample-vpc"
kind: EnvironmentConfig
metadata:
    name: environment-config
---
# Source: liferay-gcp-infrastructure-provider/templates/templates-environment-config.yaml
apiVersion: apiextensions.crossplane.io/v1beta1
data:
    liferay-templates: |
        {{- $databasePort := "5432" -}}
        {{- $elasticsearchHealth := "" -}}
        {{- $env := index .context "apiextensions.crossplane.io/environment" -}}
        {{- $isReady := false -}}
        {{- $isSearchReady := false -}}
        {{- $managementPoliciesOnce := (list "Create" "Observe" "Delete") | toJson -}}
        {{- $xr := .observed.composite.resource -}}
        
        {{- $backup := $xr.spec.backup | default dict -}}
        {{- $cmkEnabled := $xr.spec.cmk.enabled | default false -}}
        {{- $databaseName := $xr.spec.database.name | default "lportal" -}}
        {{- $databaseSpec := $xr.spec.database -}}
        {{- $environmentId := $xr.spec.environmentId -}}
        {{- $forceDestroy := $xr.spec.forceDestroy | default false -}}
        {{- $gsaName := printf "%s-sa" $xr.metadata.name -}}
        {{- $managementPolicies := $xr.spec.orphanOnDelete | ternary (list "Create" "Observe" "Update") (list "*") | toJson -}}
        {{- $managementPoliciesNoUpdate := $xr.spec.orphanOnDelete | ternary (list "Create" "Observe") (list "Create" "Delete" "Observe") | toJson -}}
        {{- $namespace := $xr.metadata.namespace -}}
        {{- $overlay := $xr.spec.overlay | default dict -}}
        {{- $projectId := $xr.spec.projectId -}}
        {{- $restorePhase := $xr.spec.restorePhase | default "none" -}}
        {{- $searchName := printf "%s-es" $xr.metadata.name -}}
        {{- $storage := $xr.spec.storage | default dict -}}
        {{- $targetActiveDataPlane := $xr.spec.targetActiveDataPlane | default "blue" -}}
        
        {{- $activeDataPlane := $targetActiveDataPlane -}}
        {{- $databaseIamUser := printf "%s@%s.iam" $gsaName $env.projectId -}}
        {{- $databaseInstanceManagementPolicies := $backup.enabled | ternary ((list "*") | toJson) $managementPolicies -}}
        {{- $dataPlanes := list $targetActiveDataPlane -}}
        {{- $gsaEmail := printf "%s@%s.iam.gserviceaccount.com" $gsaName $env.projectId -}}
        {{- $hash := printf "%s-%s" $databaseName $env.projectId | sha256sum | trunc 7 -}}
        {{- $labels := merge ($xr.spec.commonTags | default dict) (dict "app" "liferay" "deployment-name" $env.deploymentName "environment-id" $environmentId "project-id" $projectId) -}}
        {{- $projectIdFull := printf "%s-%s" $projectId $environmentId -}}
        {{- $region := $databaseSpec.region | default $xr.spec.region -}}
        {{- $searchNamespace := printf "%s-elasticsearch" $namespace -}}
        {{- $searchSecretName := printf "%s-es-elastic-user" $searchName -}}
        {{- $targetInactiveDataPlane := (eq $targetActiveDataPlane "blue") | ternary "green" "blue" -}}
        
        {{- if (eq $restorePhase "promoting") -}}
            {{- $dataPlanes = list "blue" "green" -}}
        {{- else if (eq $restorePhase "provisioning") -}}
            {{- $activeDataPlane = $targetInactiveDataPlane -}}
            {{- $dataPlanes = list "blue" "green" -}}
        {{- end }}
        
        {{- $backupTargetLabels := merge (dict) $labels (dict "should-back-up" "true") -}}
        {{- $uidHash := printf "%s-%s" $env.projectNumber $projectIdFull | sha256sum | trunc 6 -}}
        
        {{- $baseName := printf "%.18s-%s" $projectIdFull $uidHash -}}
        
        {{- $cmkKeyName := printf "projects/%s/locations/%s/keyRings/%s-keyring/cryptoKeys/%s-key" $env.projectId $region $baseName $baseName -}}
        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
        kind: ServiceAccount
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-gsa
            labels:
                {{- $labels | toYaml | nindent 8 }}
            name: {{ $gsaName }}
        spec:
            forProvider:
                displayName: Liferay {{ $gsaName }} Service Account
        ---
        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
        kind: ServiceAccountIAMMember
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-wi-binding
            labels:
                {{- $labels | toYaml | nindent 8 }}
        spec:
            forProvider:
                member: serviceAccount:{{ $env.projectId }}.svc.id.goog[{{ $namespace }}/liferay-default]
                role: roles/iam.workloadIdentityUser
                serviceAccountIdRef:
                    name: {{ $gsaName }}
        ---
        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
        kind: ProjectIAMMember
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-sql-instance-user-role
            labels:
                {{- $labels | toYaml | nindent 8 }}
        spec:
            forProvider:
                member: serviceAccount:{{ $gsaEmail }}
                project: {{ $env.projectId }}
                role: roles/cloudsql.instanceUser
        ---
        apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
        kind: ProjectIAMMember
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-sql-client-role
            labels:
                {{- $labels | toYaml | nindent 8 }}
        spec:
            forProvider:
                member: serviceAccount:{{ $gsaEmail }}
                project: {{ $env.projectId }}
                role: roles/cloudsql.client
        {{- range $i, $dataPlane := $dataPlanes }}
        {{- $databaseInstanceName := printf "%s-db-instance-%s" $xr.metadata.name $dataPlane }}
        {{- if $i }}
        ---
        {{- end }}
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: DatabaseInstance
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: database-primary-{{ $dataPlane }}
            labels:
                {{- $labels | toYaml | nindent 8 }}
                dataPlane: {{ $dataPlane }}
            name: {{ $databaseInstanceName }}
        spec:
            forProvider:
                databaseVersion: {{ $databaseSpec.databaseVersion | default "POSTGRES_18" }}
                deletionProtection: {{ and ($databaseSpec.deletionProtection | default ($xr.spec.deletionProtection | default false)) (eq $dataPlane $activeDataPlane) }}
                {{- if $cmkEnabled }}
                encryptionKmsKeyName: {{ $cmkKeyName }}
                {{- end }}
                region: {{ $region }}
                rootPasswordSecretRef:
                    key: password
                    name: {{ $databaseSpec.rootPasswordSecretName }}
                settings:
                    databaseFlags:
                        -   name: cloudsql.iam_authentication
                            value: "on"
                    diskSize: {{ $databaseSpec.storageGB | default 10 }}
                    diskType: PD_SSD
                    edition: ENTERPRISE
                    insightsConfig:
                        queryInsightsEnabled: {{ $databaseSpec.queryInsightsEnabled | default true }}
                    ipConfiguration:
                        ipv4Enabled: false
                        privateNetwork: projects/{{ $env.projectId }}/global/networks/{{ $env.vpcName }}
                        sslMode: TRUSTED_CLIENT_CERTIFICATE_REQUIRED
                    retainBackupsOnDelete: true
                    tier: {{ $databaseSpec.instanceType | default "db-custom-1-3840" }}
                    userLabels:
                        {{- $backupTargetLabels | toYaml | nindent 16 }}
                        active: {{ printf "%t" (eq $dataPlane $activeDataPlane) | quote }}
            managementPolicies: {{ $databaseInstanceManagementPolicies }}
        ---
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: Database
        metadata:
            annotations:
                crossplane.io/external-name: {{ $databaseName }}
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-db-{{ $dataPlane }}
            labels:
                {{- $labels | toYaml | nindent 8 }}
                dataPlane: {{ $dataPlane }}
            name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
        spec:
            forProvider:
                charset: UTF8
                collation: en_US.UTF8
                instanceSelector:
                    matchLabels:
                        dataPlane: {{ $dataPlane }}
            managementPolicies: ["Create", "Observe", "Update"]
        ---
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: User
        metadata:
            annotations:
                crossplane.io/external-name: {{ $databaseIamUser }}
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-iam-user-{{ $dataPlane }}
            labels:
                {{- $labels | toYaml | nindent 8 }}
                dataPlane: {{ $dataPlane }}
            name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
        spec:
            forProvider:
                instanceSelector:
                    matchLabels:
                        dataPlane: {{ $dataPlane }}
                type: CLOUD_IAM_SERVICE_ACCOUNT
            managementPolicies: ["Create", "Observe", "Update"]
        {{- end }}
        {{- range $dataPlane := list "blue" "green" }}
        {{- $databaseInstanceName := printf "%s-db-instance-%s" $xr.metadata.name $dataPlane }}
        {{- $databaseResourceName := printf "liferay-db-%s" $dataPlane }}
        {{- $userResourceName := printf "liferay-iam-user-%s" $dataPlane }}
        {{- if or (has $dataPlane $dataPlanes) (and $.observed.resources (index $.observed.resources $databaseResourceName)) }}
        ---
        apiVersion: protection.crossplane.io/v1beta1
        kind: Usage
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-database-{{ $dataPlane }}
            name: {{ $xr.metadata.name }}-instance-by-database-{{ $dataPlane }}
            namespace: {{ $namespace }}
        spec:
            by:
                apiVersion: sql.gcp.m.upbound.io/v1beta1
                kind: Database
                resourceRef:
                    name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
            of:
                apiVersion: sql.gcp.m.upbound.io/v1beta1
                kind: DatabaseInstance
                resourceRef:
                    name: {{ $databaseInstanceName }}
        {{- end }}
        {{- if or (has $dataPlane $dataPlanes) (and $.observed.resources (index $.observed.resources $userResourceName)) }}
        ---
        apiVersion: protection.crossplane.io/v1beta1
        kind: Usage
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-user-{{ $dataPlane }}
            name: {{ $xr.metadata.name }}-instance-by-user-{{ $dataPlane }}
            namespace: {{ $namespace }}
        spec:
            by:
                apiVersion: sql.gcp.m.upbound.io/v1beta1
                kind: User
                resourceRef:
                    name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
            of:
                apiVersion: sql.gcp.m.upbound.io/v1beta1
                kind: DatabaseInstance
                resourceRef:
                    name: {{ $databaseInstanceName }}
        {{- end }}
        {{- end }}
        apiVersion: kubernetes.m.crossplane.io/v1alpha1
        kind: Object
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-ksa
            labels:
                {{- $labels | toYaml | nindent 8 }}
            name: {{ $xr.metadata.name }}-ksa
        spec:
            forProvider:
                manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                        annotations:
                            iam.gke.io/gcp-service-account: {{ $gsaEmail }}
                        labels:
                            {{- $labels | toYaml | nindent 20 }}
                        name: liferay-default
                        namespace: {{ $namespace }}
        {{- range $dataPlane := $dataPlanes }}
        {{- $dbInstanceResourceName := printf "database-primary-%s" $dataPlane }}
        {{- $dbReady := false }}
        {{- if $.observed.resources }}
            {{- if (index $.observed.resources $dbInstanceResourceName) }}
                {{- $db := index $.observed.resources $dbInstanceResourceName }}
                {{- range $cond := $db.resource.status.conditions | default list }}
                    {{- if and (eq $cond.type "Ready") (eq $cond.status "True") }}
                        {{- $dbReady = true }}
                    {{- end }}
                {{- end }}
            {{- end }}
        {{- end }}
        {{- if $dbReady }}
        {{- $instanceConnectionName := printf "%s:%s:%s-db-instance-%s" $env.projectId $region $xr.metadata.name $dataPlane }}
        {{- $jobName := printf "%s-db-grant-%s" $xr.metadata.name $dataPlane }}
        ---
        apiVersion: kubernetes.m.crossplane.io/v1alpha1
        kind: Object
        metadata:
            annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: liferay-db-grant-job-{{ $dataPlane }}
            labels:
                {{- $labels | toYaml | nindent 8 }}
                dataPlane: {{ $dataPlane }}
            name: {{ $jobName }}
        spec:
            forProvider:
                manifest:
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                        labels:
                            {{- $labels | toYaml | nindent 20 }}
                            dataPlane: {{ $dataPlane }}
                        name: {{ $jobName }}
                        namespace: {{ $namespace }}
                    spec:
                        template:
                            spec:
                                containers:
                                    -   args:
                                            -   |
                                                    set -e
                                                    until pg_isready -h 127.0.0.1 -p {{ $databasePort }} -U postgres; do sleep 2; done
                                                    psql -h 127.0.0.1 -v "ON_ERROR_STOP=1" -U postgres -d {{ $databaseName }} <<EOF
                                                    GRANT ALL PRIVILEGES ON DATABASE "{{ $databaseName }}" TO "{{ $databaseIamUser }}";
                                                    GRANT ALL ON ALL TABLES IN SCHEMA public TO "{{ $databaseIamUser }}";
                                                    GRANT cloudsqlsuperuser TO "{{ $databaseIamUser }}";
                                                    GRANT "{{ $databaseIamUser }}" to postgres;
                                                    EOF
                                        command:
                                            -   /bin/sh
                                            -   -c
                                        env:
                                            -   name: PGPASSWORD
                                                valueFrom:
                                                    secretKeyRef:
                                                        key: password
                                                        name: {{ $databaseSpec.rootPasswordSecretName }}
                                        image: postgres:18-alpine
                                        name: sql-runner
                                        resources:
                                            limits:
                                                cpu: 200m
                                                memory: 256Mi
                                            requests:
                                                cpu: 100m
                                                memory: 128Mi
                                        securityContext:
                                            allowPrivilegeEscalation: false
                                            capabilities:
                                                drop:
                                                    -   ALL
                                            runAsNonRoot: true
                                            runAsUser: 1000
                                            seccompProfile:
                                                type: RuntimeDefault
                                initContainers:
                                    -   args:
                                            -   --auto-iam-authn
                                            -   --port={{ $databasePort }}
                                            -   --private-ip
                                            -   --structured-logs
                                            -   "{{ $instanceConnectionName }}"
                                        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
                                        name: cloud-sql-proxy
                                        resources:
                                            limits:
                                                cpu: 200m
                                                memory: 256Mi
                                            requests:
                                                cpu: 100m
                                                memory: 128Mi
                                        restartPolicy: Always
                                        securityContext:
                                            allowPrivilegeEscalation: false
                                            capabilities:
                                                drop:
                                                    -   ALL
                                            runAsNonRoot: true
                                            runAsUser: 65532
                                            seccompProfile:
                                                type: RuntimeDefault
                                restartPolicy: OnFailure
                                securityContext:
                                    fsGroup: 1000
                                    runAsNonRoot: true
                                    seccompProfile:
                                        type: RuntimeDefault
                                serviceAccountName: liferay-default
                                volumes:
                                    -   emptyDir: {}
                                        name: term-log
            managementPolicies: {{ $managementPoliciesOnce }}
            readiness:
                celQuery: object.status.succeeded == 1
                policy: DeriveFromCelQuery
        {{- end }}
        {{- end }}
        ---
        {{- $isReady = false }}
        {{- if .observed.resources }}
            {{- $activeJobResourceName := printf "liferay-db-grant-job-%s" $activeDataPlane }}
            {{- if (index .observed.resources $activeJobResourceName) }}
