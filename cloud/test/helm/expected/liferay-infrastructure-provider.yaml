apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        app: liferay
        component: gateway
    name: liferay-proxy-config
    namespace: envoy-gateway-system
spec:
    provider:
        kubernetes:
            envoyDeployment:
                pod:
                    annotations:
                        iam.gke.io/gcp-service-account: "sample-envoy-proxy@sample-project.iam.gserviceaccount.com"
