# Source: liferay-gcp-infrastructure/templates/database-root-password.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-30"
        helm.sh/resource-policy: keep
    name: sample-prd-infra-db-root-password
    namespace: liferay-sample-prd
