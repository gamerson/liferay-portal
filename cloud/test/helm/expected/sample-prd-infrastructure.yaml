# Source: liferay-gcp-infrastructure/templates/liferayinfrastructure.yaml
apiVersion: gcp.liferay.com/v1alpha1
kind: LiferayInfrastructure
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-20"
    name: sample-prd-infra
    namespace: liferay-sample-prd
spec:
    backup:
        enabled: false
        region: ""
        retentionDays: 30
        storageClass: "NEARLINE"
    cmk: 
        enabled: false
    commonTags:
        environment_id: prd
        project_id: sample
    database:
        databaseVersion: POSTGRES_18
        deletionProtection: true
        instanceType: db-custom-1-3840
        queryInsightsEnabled: true
        rootPasswordSecretName: sample-prd-infra-db-root-password
        storageGB: 20
    environmentId: prd
    forceDestroy: false
    orphanOnDelete: false
    overlay: 
        bucketName: sample-liferay-overlay
        enabled: true
        githubRepo: ""
    projectId: sample
    region: us-central1
    storage: 
        enableVersioning: true
        region: ""
---
# Source: liferay-gcp-infrastructure/templates/database-root-password.yaml
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-40"
        helm.sh/resource-policy: keep
    name: sample-prd-infra-db-root-password-generator
    namespace: liferay-sample-prd
spec:
    allowRepeat: false
    digits: 5
    length: 24
    noUpper: false
    symbolCharacters: -_$@
    symbols: 2
