# Source: liferay-gcp-infrastructure/templates/pod-monitoring.yaml
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
    name: envoy
    namespace: liferay-sample-prd
spec:
    endpoints:
        -   interval: 1m
            metricRelabeling:
                -   action: keep
                    regex: "^envoy_(http_downstream_(rq_(total|xx|time_(bucket|sum|count))|cx_[rt]x_bytes_total)|cluster_upstream_rq_(total|time_(bucket|sum|count)))$"
                    sourceLabels:
                        -   __name__
            path: /stats/prometheus
            port: 19001
    selector:
        matchLabels:
            app.kubernetes.io/name: "envoy"
---
# Source: liferay-gcp-infrastructure/templates/pod-monitoring.yaml
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
    name: liferay
    namespace: liferay-sample-prd
spec:
    endpoints:
        -   interval: 1m
            metricRelabeling:
                -   action: keep
                    regex: "^(?:Catalina_(?:GlobalRequestProcessor_(?:.*_)?(?:errorCount|processingTime|requestCount)|ThreadPool_(?:.*_)?(?:currentThreadCount|currentThreadsBusy))|com_zaxxer_hikari_Pool_(?:.*_)?(?:ActiveConnections|IdleConnections|ThreadsAwaitingConnection|TotalConnections)|java_lang_Threading_ThreadCount|jvm_(?:(?:buffer_pool|memory(?:_pool)?)_used_bytes|classes_currently_loaded|gc_collection_seconds_(?:count|sum)|threads_(?:current|peak|state))|process_(?:cpu_seconds_total|open_fds|resident_memory_bytes))$"
                    sourceLabels:
                        -   __name__
            path: /metrics
            port: 12345
    selector:
        matchLabels:
            app: "liferay-default"
            app.kubernetes.io/name: "liferay-default"
