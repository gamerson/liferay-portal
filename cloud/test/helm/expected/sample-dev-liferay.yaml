apiVersion: v1
kind: Pod
metadata:
    annotations:
        helm.sh/hook: test
    labels:
        app.kubernetes.io/instance: sample-dev-app
        app.kubernetes.io/name: liferay-default
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "latest"
        component: liferay
        helm.sh/chart: liferay-default-0.5.0
        origin: liferay-gcp
    name: liferay-default-test-connection
    namespace: liferay-sample-dev
spec:
    containers:
        -   command:
                -   /bin/sh
                -   -c
                -   |
                        trap "echo 'Received signal to terminate.'; exit 0" SIGINT SIGTERM

                        START_TIME=$(date +%s)

                        until nc -vz -w 2 liferay-default 8080
                        do
                            CURRENT_TIME=$(date +%s)

                            DELTA_TIME=$((${CURRENT_TIME} - ${START_TIME}))

                            if [ ${DELTA_TIME} -gt 300 ]
                            then
                                echo "Liferay did not start."

                                exit 1
                            fi

                            echo "Waiting for Liferay..."

                            sleep 2
                        done
            image: busybox:latest
            name: test-connection
            securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                    drop:
                        -   ALL
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                    type: RuntimeDefault
    restartPolicy: Never
    serviceAccountName: liferay-default
