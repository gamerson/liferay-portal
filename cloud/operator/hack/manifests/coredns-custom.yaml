apiVersion: v1
data:
    __DOMAIN_SUFFIX__.server: |
        __DOMAIN_SUFFIX__:53 {
          errors
          template IN A __DOMAIN_SUFFIX__ {
            match .*.__DOMAIN_SUFFIX__
            answer "{{ .Name }} 60 IN A __GATEWAY_IP__"
          }
          template IN AAAA __DOMAIN_SUFFIX__ {
            match .*.__DOMAIN_SUFFIX__
            rcode NXDOMAIN
          }
          cache 30
          loop
          reload
          loadbalance
        }
# Resolves every host under the demo domain to the cluster's load balancer, so
# one name works from everywhere.
#
# A client extension pod, the Liferay pod and the developer's browser all use
# the same URL. In the cluster this answer sends the request to the load
# balancer, where the ingress controller routes it by Host exactly as it does
# for the browser. Nothing has to be re-pointed when a Service is recreated,
# because no ClusterIP appears here.
kind: ConfigMap
metadata:
    name: coredns-custom
    namespace: kube-system