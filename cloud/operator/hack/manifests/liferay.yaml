# The simulated Liferay. It publishes the virtual instance metadata ConfigMap
# and performs the ext-provision to ext-init round trip that the real
# portal-k8s-agent performs inside DXP.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: dxpsim
    namespace: __LIFERAY_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: dxpsim
    namespace: __LIFERAY_NAMESPACE__
rules:
    -   apiGroups:
            -   ""
        resources:
            -   configmaps
        verbs:
            -   create
            -   delete
            -   get
            -   list
            -   patch
            -   update
            -   watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: dxpsim
    namespace: __LIFERAY_NAMESPACE__
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: dxpsim
subjects:
    -   kind: ServiceAccount
        name: dxpsim
        namespace: __LIFERAY_NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: dxpsim
    namespace: __LIFERAY_NAMESPACE__
spec:
    replicas: 1
    selector:
        matchLabels:
            app: dxpsim
    template:
        metadata:
            labels:
                app: dxpsim
        spec:
            containers:
                -   env:
                        -   name: NAMESPACE
                            value: __LIFERAY_NAMESPACE__
                        -   name: VIRTUAL_INSTANCE_IDS
                            value: __VIRTUAL_INSTANCE_ID__
                        -   name: VIRTUAL_HOST
                            value: localhost
                    image: __DXPSIM_IMAGE__
                    imagePullPolicy: Never
                    name: dxpsim
                    resources:
                        limits:
                            cpu: 200m
                            memory: 128Mi
                        requests:
                            cpu: 50m
                            memory: 64Mi
            serviceAccountName: dxpsim
---
# The LiferayEnvironment the client extensions attach to. Its
# clientExtensionNamespaces list is the consent boundary: a namespace that is
# not listed cannot provision against this Liferay.
apiVersion: licensing.liferay.com/v1alpha1
kind: LiferayEnvironment
metadata:
    name: liferay-default
    namespace: __LIFERAY_NAMESPACE__
spec:
    activationCodeSecretRef:
        key: activationCode
        name: liferay-activation
    clientExtensionNamespaces:
        -   __CX_NAMESPACE_SPLIT__
    workloadRef:
        name: liferay