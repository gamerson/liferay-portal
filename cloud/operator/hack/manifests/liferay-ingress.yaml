# Reaching Liferay from the host. k3d publishes the load balancer on 8080, and
# liferay.localtest.me resolves to 127.0.0.1 without touching /etc/hosts.
#
# The host must also be a virtual host of the virtual instance, otherwise
# Liferay answers 500 to every request that carries it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: liferay
    namespace: __LIFERAY_NAMESPACE__
spec:
    rules:
        # The browser's OAuth2 client derives a PKCE challenge through
        # crypto.subtle, which only exists in a secure context. Plain HTTP on a
        # named host is not one; loopback is. Serving the portal on localhost as
        # well gives a trustworthy origin without a certificate.
        -   host: localhost
            http:
                paths:
                    -   backend:
                            service:
                                name: liferay
                                port:
                                    number: 80
                        path: /
                        pathType: Prefix
        -   host: liferay.localtest.me
            http:
                paths:
                    -   backend:
                            service:
                                name: liferay
                                port:
                                    number: 80
                        path: /
                        pathType: Prefix