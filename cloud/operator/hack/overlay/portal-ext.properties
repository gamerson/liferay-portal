#
# Environment specific portal configuration, delivered as an overlay from
# object storage rather than baked into the image.
#

jdbc.default.driverClassName=org.mariadb.jdbc.Driver
jdbc.default.password=liferay
jdbc.default.url=jdbc:mariadb://mariadb:3306/lportal?characterEncoding=UTF-8&useFastDateParsing=false&useUnicode=true
jdbc.default.username=liferay

liferay.home=/opt/liferay

setup.wizard.enabled=false

#
# Skip the parts of first boot that are slow and irrelevant to the client
# extension handshake.
#

default.admin.email.address=test@liferay.com
default.admin.screen.name=test

#
# The agent reads its service account token through the Felix interpolation
# plugin, so no credential is baked into the overlay.
#

module.framework.properties.org.apache.felix.configadmin.plugin.interpolation.secretsdir=/var/run/secrets/kubernetes.io/serviceaccount
