{{- if .Values.liferayExtensionsStorage.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.liferayExtensionsStorage.storageClassName }}
provisioner: s3.csi.aws.com
parameters:
  bucketName: {{ .Values.liferayExtensionsStorage.bucketName }}
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.liferayExtensionsStorage.volumeName }}
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.liferayExtensionsStorage.storageClassName }}
  csi:
    driver: s3.csi.aws.com
    volumeHandle: s3-csi-driver-volume
    volumeAttributes:
      bucketName: {{ .Values.liferayExtensionsStorage.bucketName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.liferayExtensionsStorage.claimName }}
spec:
  accessModes:
    - {{ .Values.liferayExtensionsStorage.accessModes }}
  storageClassName: {{ .Values.liferayExtensionsStorage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.liferayExtensionsStorage.storageRequest }}
{{- end }}
