{{- $activatedByDXP := eq (include "liferay.activatedByDXP" .) "true" -}}
{{- $liferayServiceAccount := .Values.global.liferayServiceAccount -}}
{{- if or $liferayServiceAccount.role.rules $activatedByDXP -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    {{- with $liferayServiceAccount.role.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ include "liferay.name" . }}
    namespace: {{ include "liferay.namespace" . }}
rules:
    {{- with $liferayServiceAccount.role.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $activatedByDXP }}
    {{- $liferayEnvironmentName := include "liferay.name" . }}
    -   apiGroups:
            -   ""
        resourceNames:
            -   {{ include "liferay.namespace" . }}
        resources:
            -   namespaces
        verbs:
            -   get
    -   apiGroups:
            -   ""
        resources:
            -   secrets
        verbs:
            -   create
    -   apiGroups:
            -   ""
        resourceNames:
            -   {{ $liferayEnvironmentName }}-entitlements
            -   {{ $liferayEnvironmentName }}-identity
        resources:
            -   secrets
        verbs:
            -   get
            -   update
    -   apiGroups:
            -   licensing.liferay.com
        resourceNames:
            -   {{ $liferayEnvironmentName }}
        resources:
            -   liferayenvironments
        verbs:
            -   get
    -   apiGroups:
            -   licensing.liferay.com
        resourceNames:
            -   {{ $liferayEnvironmentName }}
        resources:
            -   liferayenvironments/status
        verbs:
            -   patch
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ include "liferay.name" . }}
    namespace: {{ include "liferay.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "liferay.name" . }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "liferay.serviceAccountName" . }}
        namespace: {{ include "liferay.namespace" . }}
{{- end }}
{{- if $liferayServiceAccount.create }}
---
apiVersion: v1
automountServiceAccountToken: {{ $liferayServiceAccount.automount }}
kind: ServiceAccount
metadata:
    {{- with $liferayServiceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ include "liferay.serviceAccountName" . }}
    namespace: {{ include "liferay.namespace" . }}
{{- end }}