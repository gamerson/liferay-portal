{{- if and .Values.licensing.enabled .Values.licensing.offlineActivationWorkflow.enabled -}}
{{- $offlineActivationWorkflow := .Values.licensing.offlineActivationWorkflow -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: license-activation-role
    namespace: {{ include "liferay.namespace" . }}
rules:
    -   apiGroups: [""]
        resourceNames: ["{{ include "liferay.name" . }}-identity"]
        resources: ["secrets"]
        verbs: ["get"]
    -   apiGroups: ["argoproj.io"]
        resources: ["workflows"]
        verbs: ["create", "get", "list", "watch"]
    -   apiGroups: ["argoproj.io"]
        resources: ["workflowtemplates"]
        verbs: ["get", "list"]
    -   apiGroups: ["licensing.liferay.com"]
        resources: ["liferayenvironments"]
        verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: license-activation-role-binding
    namespace: {{ include "liferay.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: license-activation-role
subjects:
    -   kind: ServiceAccount
        name: {{ include "liferay.serviceAccountName" . }}
        namespace: {{ include "liferay.namespace" . }}
{{- end -}}