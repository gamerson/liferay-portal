release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Service Account
templates:
    -   templates/serviceaccount.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: Role
            -   documentIndex: 1
                equal:
                    path: subjects[0].name
                    value: liferay-default
        it: Binds the role to an account the chart does not create
        set:
            global.liferayServiceAccount.create: false
            global.liferayServiceAccount.name: liferay-default
    -   asserts:
            -   contains:
                    content:
                        apiGroups:
                            -   ""
                        resourceNames:
                            -   liferay-acme-prd
                        resources:
                            -   namespaces
                        verbs:
                            -   get
                    path: rules
            -   contains:
                    content:
                        apiGroups:
                            -   ""
                        resourceNames:
                            -   liferay-default-entitlements
                            -   liferay-default-identity
                        resources:
                            -   secrets
                        verbs:
                            -   get
                            -   update
                    path: rules
            -   contains:
                    content:
                        apiGroups:
                            -   licensing.liferay.com
                        resourceNames:
                            -   liferay-default
                        resources:
                            -   liferayenvironments/status
                        verbs:
                            -   patch
                    path: rules
        documentSelector:
            path: kind
            value: Role
        it: Grants DXP its namespace, secrets, and LiferayEnvironment status when DXP activates
        set:
            global.liferayServiceAccount.role.rules: []
            licensing.activationMode: DXP
            licensing.enabled: true