{{- $dxpOperator := .Values.operatorApplications.dxpOperator -}}
{{- if and .Values.liferay.enabled $dxpOperator.enabled (dig "clientExtensions" "enabled" false ($dxpOperator.values | default dict)) -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
    annotations:
        argocd.argoproj.io/compare-options: IgnoreExtraneous
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: liferay-client-extension-appproject
    name: liferay-client-extension
    namespace: {{ .Release.Namespace }}
spec:
    description:
        ArgoCD project for the client extensions listed in each environment's liferay.yaml.
    destinations:
        -   namespace: liferay-*
            server: https://kubernetes.default.svc
    namespaceResourceWhitelist:
        -   group: ""
            kind: Service
        -   group: ""
            kind: ServiceAccount
        -   group: apps
            kind: Deployment
        -   group: batch
            kind: CronJob
        -   group: batch
            kind: Job
        -   group: cx.liferay.com
            kind: ClientExtension
        -   group: gateway.networking.k8s.io
            kind: HTTPRoute
    sourceRepos:
        {{- if .Values.clientExtensions.sourceRepos }}
        {{- include "liferay-platform.sourceRepos" .Values.clientExtensions.sourceRepos | nindent 8 }}
        {{- else }}
        -   oci://**
        {{- end }}
{{- end -}}
