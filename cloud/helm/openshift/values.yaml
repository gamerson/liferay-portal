liferay-default:
    podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
            type: RuntimeDefault
    securityContext:
        allowPrivilegeEscalation: false
        capabilities:
            drop:
                -   ALL
        runAsNonRoot: true
        seccompProfile:
            type: RuntimeDefault
route:
    annotations: {}
    enabled: true
    host: ""
    labels: {}
    port:
        targetPort: http
    tls:
        enabled: true
        insecureEdgeTerminationPolicy: Redirect
        termination: edge