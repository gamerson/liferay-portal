affinity: {}
customLabels: {}
fullnameOverride: ""
image:
    pullPolicy: IfNotPresent
    pullSecrets: []
    repository: liferay/liferay-cloud-operator
    tag: latest
nameOverride: ""
namespaceOverride: ""
nodeSelector: {}
podAnnotations: {}
podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault
probes:
    port: 8081
provisioning:
    # Base URL of the provisioning API. Point this at the local mock to test the
    # full activation/entitlements path (see cloud/operator/hack/README.md).
    baseURL: "https://provisioning.liferay.com"
rbac:
    create: true
replicaCount: 1
resources:
    limits:
        cpu: 500m
        memory: 256Mi
    requests:
        cpu: 100m
        memory: 128Mi
metrics:
    port: 8080
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            -   ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
serviceAccount:
    annotations: {}
    create: true
    name: ""
tolerations: []
webhook:
    # Self-signed certificate generated by the chart. This is the PoC seam:
    # revisit with cert-manager when webhooks proliferate on CNE.
    certificateValidityDays: 3650
    enabled: true
    failurePolicy: Ignore
    port: 9443
