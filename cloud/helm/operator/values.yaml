affinity: {}
customLabels: {}
fullnameOverride: ""
image:
    pullPolicy: IfNotPresent
    pullSecrets: []
    repository: liferay/liferay-cloud-operator
    tag: latest
nameOverride: ""
namespaceOverride: ""
nodeSelector: {}
podAnnotations: {}
podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
        type: RuntimeDefault
probes:
    port: 8081
provisioning:
    # Base URL of the provisioning API. Point this at the local mock to test the
    # full activation/entitlements path (see cloud/operator/hack/README.md).
    baseURL: "https://provisioning.liferay.com"
rbac:
    create: true
replicaCount: 1
resources:
    limits:
        cpu: 500m
        memory: 256Mi
    requests:
        cpu: 100m
        memory: 128Mi
metrics:
    port: 8080
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            -   ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
serviceAccount:
    annotations: {}
    create: true
    name: ""
tolerations: []
webhook:
    # Self-signed certificate generated by the chart. This is the PoC seam:
    # revisit with cert-manager when webhooks proliferate on CNE.
    certificateValidityDays: 3650
    enabled: true
    # Fail-closed (AC #6): if the ceiling cannot be confirmed, deny. Safe only
    # because namespaceSelector scopes the webhook to Liferay environment
    # namespaces, so an operator outage cannot freeze StatefulSets elsewhere.
    failurePolicy: Fail
    # Only namespaces carrying this label are subject to enforcement. The Liferay
    # environment namespace must set it. namespaceSelector (not objectSelector)
    # is required so the scale subresource is covered — the Scale object does not
    # carry the StatefulSet's labels.
    namespaceSelector:
        matchLabels:
            licensing.liferay.com/enforce-node-limit: "true"
    port: 9443
