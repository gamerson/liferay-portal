apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    annotations:
        controller-gen.kubebuilder.io/version: v0.18.0
    name: clientextensions.cx.liferay.com
spec:
    group: cx.liferay.com
    names:
        kind: ClientExtension
        listKind: ClientExtensionList
        plural: clientextensions
        shortNames:
        -   cx
        singular: clientextension
    scope: Namespaced
    versions:
    -   additionalPrinterColumns:
        -   jsonPath: .spec.liferayEnvironmentRef.namespace
            name: DXP-Namespace
            type: string
        -   jsonPath: .spec.virtualInstanceId
            name: Virtual-Instance
            type: string
        -   jsonPath: .spec.workloadRef.kind
            name: Workload
            type: string
        -   jsonPath: .status.conditions[?(@.type=="Delivered")].status
            name: Delivered
            type: string
        -   jsonPath: .status.conditions[?(@.type=="ConfigurationAccepted")].status
            name: Config-Accepted
            type: string
        -   jsonPath: .status.conditions[?(@.type=="Provisioned")].status
            name: Provisioned
            type: string
        -   jsonPath: .status.phase
            name: Phase
            type: string
        -   jsonPath: .metadata.creationTimestamp
            name: Age
            type: date
        -   jsonPath: .spec.serviceId
            name: Service-ID
            priority: 1
            type: string
        name: v1alpha1
        schema:
            openAPIV3Schema:
                properties:
                    apiVersion:
                        description: |-
                            APIVersion defines the versioned schema of this representation of an object.
                            Servers should convert recognized schemas to the latest internal value, and
                            may reject unrecognized values.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                        type: string
                    kind:
                        description: |-
                            Kind is a string value representing the REST resource this object represents.
                            Servers may infer this from the endpoint the client submits requests to.
                            Cannot be updated.
                            In CamelCase.
                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                        type: string
                    metadata:
                        type: object
                    spec:
                        properties:
                            clientExtensionYaml:
                                description: |-
                                    ClientExtensionYAML is the expanded client-extension.yaml document. The
                                    operator translates it into the OSGi configuration payload. Globs and
                                    frontendTokenDefinitionJSON references must already be resolved by the
                                    build, because the operator cannot read the built assets.
                                type: string
                            configs:
                                description: |-
                                    Configs are pre-translated configuration payloads, used when a build
                                    emits JSON directly instead of expanded YAML. Mutually exclusive with
                                    ClientExtensionYAML.
                                items:
                                    type: string
                                type: array
                            domain:
                                description: |-
                                    Domain is the host a client extension is reached at. One name serves
                                    both callers: a browser resolves it through the ingress, and Liferay
                                    resolves the same name to the Service inside the cluster. It becomes the
                                    ext.lxc.liferay.com/mainDomain annotation, which Liferay turns into
                                    .serviceAddress and baseURL.
                                type: string
                            liferayEnvironmentRef:
                                description: |-
                                    LiferayEnvironmentRef identifies the Liferay this client extension attaches
                                    to. An empty Namespace means the ClientExtension's own namespace.
                                properties:
                                    name:
                                        type: string
                                    namespace:
                                        type: string
                                required:
                                -   name
                                type: object
                            projectName:
                                description: |-
                                    ProjectName seeds projectId, webContextPath and baseURL. It defaults to
                                    ServiceID and must match what the build used.
                                type: string
                            serviceId:
                                description: |-
                                    ServiceID becomes the ext.lxc.liferay.com/serviceId label, which is what
                                    determines the name of the ext-init ConfigMap Liferay writes back.
                                type: string
                            virtualInstanceId:
                                description:
                                    VirtualInstanceID is the company web ID, such as liferay.com.
                                type: string
                            workloadRef:
                                description: |-
                                    WorkloadRef is the workload this client extension runs as. Omit it
                                    entirely for a configuration-only client extension.
                                properties:
                                    apiVersion:
                                        default: apps/v1
                                        enum:
                                        -   apps/v1
                                        -   batch/v1
                                        type: string
                                    kind:
                                        enum:
                                        -   CronJob
                                        -   Deployment
                                        -   Job
                                        type: string
                                    name:
                                        type: string
                                required:
                                -   kind
                                -   name
                                type: object
                        required:
                        -   liferayEnvironmentRef
                        -   serviceId
                        -   virtualInstanceId
                        type: object
                    status:
                        properties:
                            appliedConfigurationPids:
                                items:
                                    type: string
                                type: array
                            conditions:
                                items:
                                    description:
                                        Condition contains details for one aspect of the current state of this API Resource.
                                    properties:
                                        lastTransitionTime:
                                            description: |-
                                                lastTransitionTime is the last time the condition transitioned from one status to another.
                                                This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                                            format: date-time
                                            type: string
                                        message:
                                            description: |-
                                                message is a human readable message indicating details about the transition.
                                                This may be an empty string.
                                            maxLength: 32768
                                            type: string
                                        observedGeneration:
                                            description: |-
                                                observedGeneration represents the .metadata.generation that the condition was set based upon.
                                                For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                                                with respect to the current state of the instance.
                                            format: int64
                                            minimum: 0
                                            type: integer
                                        reason:
                                            description: |-
                                                reason contains a programmatic identifier indicating the reason for the condition's last transition.
                                                Producers of specific condition types may define expected values and meanings for this field,
                                                and whether the values are considered a guaranteed API.
                                                The value should be a CamelCase string.
                                                This field may not be empty.
                                            maxLength: 1024
                                            minLength: 1
                                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                                            type: string
                                        status:
                                            description:
                                                status of the condition, one of True, False, Unknown.
                                            enum:
                                            -   "True"
                                            -   "False"
                                            -   Unknown
                                            type: string
                                        type:
                                            description:
                                                type of condition in CamelCase or in foo.example.com/CamelCase.
                                            maxLength: 316
                                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                                            type: string
                                    required:
                                    -   lastTransitionTime
                                    -   message
                                    -   reason
                                    -   status
                                    -   type
                                    type: object
                                type: array
                                x-kubernetes-list-map-keys:
                                -   type
                                x-kubernetes-list-type: map
                            configurationErrors:
                                description: |-
                                    ConfigurationErrors are the payload entries the virtual instance
                                    refused. They come from Liferay, which is the only component that knows.
                                items:
                                    description: |-
                                        ConfigurationError is one entry of the payload that the virtual instance
                                        refused, reported back by Liferay.
                                    properties:
                                        configMapName:
                                            description:
                                                ConfigMapName is the ext-provision ConfigMap the entry came from.
                                            type: string
                                        message:
                                            type: string
                                        phase:
                                            description: |-
                                                Phase is Parse when the payload could not be read at all, and Apply when
                                                a single configuration failed.
                                            enum:
                                            -   Apply
                                            -   Parse
                                            type: string
                                        pid:
                                            description:
                                                PID is the configuration persistent identity that failed.
                                            type: string
                                    type: object
                                type: array
                            extInitSecretName:
                                description: |-
                                    ExtInitSecretName is the Secret the operator mirrors Liferay's ext-init
                                    ConfigMap into. A Secret is used because that payload carries plaintext
                                    OAuth2 client secrets.
                                type: string
                            extProvisionConfigMapNames:
                                items:
                                    type: string
                                type: array
                            observedGeneration:
                                format: int64
                                type: integer
                            phase:
                                enum:
                                -   Degraded
                                -   Pending
                                -   Ready
                                type: string
                            workloadIssues:
                                description: |-
                                    WorkloadIssues are the specific problems found on the referenced
                                    workload. Knowing which mount or variable is missing is the point of
                                    validating rather than injecting.
                                items:
                                    type: string
                                type: array
                            workloadName:
                                type: string
                        type: object
                type: object
        served: true
        storage: true
        subresources:
            status: {}