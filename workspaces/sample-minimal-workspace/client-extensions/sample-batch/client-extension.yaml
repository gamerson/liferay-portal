assemble:
    - include: "batch/*"
    - include: "src/*"
sample-batch-oauth-application-headless-server:
  name: Sample Batch Application
  scopes:
    - Liferay.Headless.Batch.Engine.everything
    - Liferay.Object.Admin.REST.everything
  type: oAuthApplicationHeadlessServer
  userAccountScreenName: test
runtime:
    env:
    - name: OAUTH2_JOB_PROFILE
      value: sample-batch-oauth-application-headless-server
    - name: CURL_FLAGS
      value: "-v"