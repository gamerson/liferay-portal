assemble:
    - fromTask: bootJar
liferay-ticket-spring-boot-oauth-application-user-agent:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay Ticket Spring Boot OAuth Application User Agent
    scopes:
        - C_Ticket.everything
    type: oAuthApplicationUserAgent
liferay-ticket-spring-boot-object-action-referral:
    name: Liferay Ticket Spring Boot Object Action Referral
    oAuth2ApplicationExternalReferenceCode: liferay-ticket-spring-boot-oauth-application-user-agent
    resourcePath: /ticket/object/action/documentation/referral
    type: objectAction