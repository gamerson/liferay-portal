assemble:
    - from: build/
      include: "static/**/*"
      into: static/
joke-remote-app:
    cssURLs:
        - static/css/main.*.css
    friendlyURLMapping: joke-remote-app
    htmlElementName: joke-remote-app
    instanceable: false
    name: Joke Remote App
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        - static/js/main.*.js
    useESM: false