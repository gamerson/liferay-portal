createDockerContainer {
  exec {
    commandLine "sh", "k8s/setenv.sh"
  }

  hostConfig.network = "kind"

	withEnvVar "KUBERNETES_CERTIFICATE", project.file("k8s/.certificate").text
	withEnvVar "KUBERNETES_NAMESPACE", "default"
	withEnvVar "KUBERNETES_SERVICE_HOST", "kind-control-plane"
	withEnvVar "KUBERNETES_SERVICE_PORT", "6443"
  withEnvVar "KUBERNETES_TOKEN", project.file("k8s/.token").text
}