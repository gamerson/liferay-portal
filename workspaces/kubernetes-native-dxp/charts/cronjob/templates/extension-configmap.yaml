apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dxp-configs
  labels:
    cloud.liferay.com/serviceId: {{ .Release.Name }}
    dxp.liferay.com/configs: "true"
    projectCustomer: "yes"
    projectId: {{ .Values.projectId }}
    projectSandbox: ""
    projectTrial: "no"
    projectType: ""
  annotations:
    cloud.liferay.com/context-data: '{"domains":["{{ .Release.Name }}.localdev.me"]}'
data:
  com.liferay.oauth2.application.factory.headless.server.configuration.v1.Oauth2ApplicationHeadlessServerConfiguration-{{ .Release.Name }}.config: |
    name="$[conf:cloud.liferay.com.serviceId]"
    homePageURL="https://$[conf:cloud.liferay.com.domain.0]"
    description="{{ .Values.description }}"
    scopes=["Liferay.Headless.Admin.User.everything"]