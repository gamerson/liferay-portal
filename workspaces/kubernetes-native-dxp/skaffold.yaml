apiVersion: skaffold/v2beta28
kind: Config
build:
  tagPolicy:
    sha256: {}
  artifacts:
  - image: k8s-native-dxp
    custom:
      buildCommand: ./gradlew resolve buildDockerImage -Pdocker.image.id=$IMAGE
      dependencies:
        paths:
        - configs/common/**/*
        - configs/local/**/*
        - modules/**/*
  - image: liferayhelloworld
    custom:
      buildCommand: lxc-extensions/liferayhelloworld/build.sh
      dependencies:
        paths:
        - lxc-extensions/liferayhelloworld/public
        - lxc-extensions/liferayhelloworld/src
        - lxc-extensions/liferayhelloworld/package.json
        - lxc-extensions/liferayhelloworld/build.sh
  - image: customrestservice
    custom:
      buildCommand: lxc-extensions/customrestservice/build.sh
      dependencies:
        paths:
        - lxc-extensions/customrestservice/src/**/*
        - lxc-extensions/customrestservice/pom.xml
  - image: cronjob
    custom:
      buildCommand: lxc-extensions/cronjob/build.sh
      dependencies:
        paths:
        - lxc-extensions/cronjob/curl.sh
deploy:
  helm:
    releases:
      - name: cronjob
        chartPath: charts/cronjob
        artifactOverrides:
          image: cronjob
        valuesFiles:
          - "lxc-extensions/cronjob/values.yaml"
          - "values.yaml"
      - name: customrestservice
        chartPath: charts/customrestservice
        artifactOverrides:
          image: customrestservice
        valuesFiles:
          - "lxc-extensions/customrestservice/values.yaml"
          - "values.yaml"
      - name: liferayhelloworld
        chartPath: charts/remoteapp
        artifactOverrides:
          image: liferayhelloworld
        valuesFiles:
          - "lxc-extensions/liferayhelloworld/values.yaml"
          - "values.yaml"
      - name: k8s-native-dxp
        chartPath: charts/k8s-native-dxp
        artifactOverrides:
          image: k8s-native-dxp
        valuesFiles:
          - "values.yaml"